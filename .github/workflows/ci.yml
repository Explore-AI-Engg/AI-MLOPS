name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "production-mlops-lab/**"
      - ".github/workflows/main.yml"
  pull_request:
    branches:
      - main
    paths:
      - "production-mlops-lab/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-mlops-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: production-mlops-lab/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python files
        run: python -m compileall src scripts tests
      - name: Run unit tests
        run: pytest -q

  model-validation:
    name: Train and validate model
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: production-mlops-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: production-mlops-lab/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download and verify dataset
        run: ./scripts/fetch_dataset.sh
      - name: Run data preparation
        run: python scripts/prepare_data.py
      - name: Train and evaluate model
        run: python scripts/train.py
      - name: Export ONNX model
        run: |
          MODEL_URI="$(<artifacts/model-uri.txt)"
          python scripts/export_onnx.py --model-uri "${MODEL_URI}"
      - name: Validate ONNX Runtime parity
        run: |
          MODEL_URI="$(<artifacts/model-uri.txt)"
          python scripts/validate_onnx.py --model-uri "${MODEL_URI}"
      - name: Run model and ONNX tests
        run: pytest -q
      - name: Upload generated model artefacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-model-artefacts-${{ github.sha }}
          path: |
            production-mlops-lab/artifacts/evaluation.json
            production-mlops-lab/artifacts/data-validation.json
            production-mlops-lab/artifacts/heart_disease_model.onnx
          if-no-files-found: error
          retention-days: 7

  container-validation:
    name: Build, smoke-test and publish container
    runs-on: ubuntu-latest
    needs: model-validation

    env:
      PROJECT_ID: production-mlops-06102026
      REGION: us-central1
      GAR_REPOSITORY: heart-disease-images
      IMAGE_NAME: heart-disease-api

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: production-mlops-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: production-mlops-lab/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download dataset
        run: ./scripts/fetch_dataset.sh
      - name: Train model
        run: python scripts/train.py
      - name: Export ONNX model
        run: |
          MODEL_URI="$(<artifacts/model-uri.txt)"
          python scripts/export_onnx.py --model-uri "${MODEL_URI}"
      - name: Validate ONNX model
        run: |
          MODEL_URI="$(<artifacts/model-uri.txt)"
          python scripts/validate_onnx.py --model-uri "${MODEL_URI}"
      - name: Build Docker image
        run: docker build --tag heart-disease-api:${{ github.sha }} .
      - name: Start Docker container
        run: |
          docker run --detach \
            --name heart-disease-api-ci \
            --publish 8000:8000 \
            --env MODEL_VERSION=${{ github.sha }} \
            --env SERVICE_VERSION=ci-${{ github.run_number }} \
            heart-disease-api:${{ github.sha }}
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then
              echo
              echo "Container is ready"
              exit 0
            fi
            echo "Waiting for container readiness: attempt ${attempt}"
            sleep 2
          done
          echo "Container did not become ready" >&2
          docker logs heart-disease-api-ci
          exit 1
      - name: Run container smoke test
        run: ./scripts/container_smoke_test.sh
      - name: Inspect container user
        run: docker exec heart-disease-api-ci id
      - name: Stop container
        if: always()
        run: docker stop heart-disease-api-ci || true
        
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: mlops-ci-publisher@production-mlops-06102026.iam.gserviceaccount.com
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Tag image for Artifact Registry
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Push immutable image
        run: |
          docker push "${IMAGE_URI}"

      - name: Resolve pushed image digest
        run: |
          IMAGE_DIGEST="$(
            gcloud artifacts docker images describe "${IMAGE_URI}" \
              --format="value(image_summary.digest)"
          )"

          test -n "${IMAGE_DIGEST}"

          FULL_IMAGE_REFERENCE="${IMAGE_URI%@*}@${IMAGE_DIGEST}"

          {
            echo "IMAGE_DIGEST=${IMAGE_DIGEST}"
            echo "FULL_IMAGE_REFERENCE=${FULL_IMAGE_REFERENCE}"
          } >> "${GITHUB_ENV}"

      - name: Write image metadata
        run: |
          mkdir -p ci-output

          cat > ci-output/image-metadata.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "image_tag": "${IMAGE_URI}",
            "image_digest": "${IMAGE_DIGEST}",
            "deployment_reference": "${FULL_IMAGE_REFERENCE}",
            "model_version": "${GITHUB_SHA}",
            "service_version": "ci-${GITHUB_RUN_NUMBER}"
          }
          EOF

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata-${{ github.sha }}
          path: production-mlops-lab/ci-output/image-metadata.json
          if-no-files-found: error
          retention-days: 30

  image-publishing:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: container-validation
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: production-mlops-06102026
      REGION: us-central1
      GAR_REPOSITORY: heart-disease-images
      IMAGE_NAME: heart-disease-api
    defaults:
      run:
        working-directory: production-mlops-lab
    steps:
      - uses: actions/checkout@v4

      - name: Download model artefacts
        uses: actions/download-artifact@v4
        with:
          name: validated-model-artefacts-${{ github.sha }}
          path: production-mlops-lab/artifacts

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: mlops-ci-publisher@production-mlops-06102026.iam.gserviceaccount.com
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      
      - name: Build image for CI commit
        run: docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Tag image for Artifact Registry
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Push image to Artifact Registry
        run: docker push "${IMAGE_URI}"

      - name: Resolve pushed image digest
        run: |
          IMAGE_DIGEST="$(
            gcloud artifacts docker images describe "${IMAGE_URI}" \
              --format="value(image_summary.digest)"
          )"

          if [[ -z "${IMAGE_DIGEST}" ]]; then
            echo "Unable to resolve pushed image digest" >&2
            exit 1
          fi

          FULL_IMAGE_REFERENCE="${IMAGE_URI%@*}@${IMAGE_DIGEST}"

          {
            echo "IMAGE_DIGEST=${IMAGE_DIGEST}"
            echo "FULL_IMAGE_REFERENCE=${FULL_IMAGE_REFERENCE}"
          } >> "${GITHUB_ENV}"

          printf '%s\n' \
            "Image tag: ${IMAGE_URI}" \
            "Image digest: ${IMAGE_DIGEST}" \
            "Deployment reference: ${FULL_IMAGE_REFERENCE}" 

      - name: Write image metadata
        run: |
          mkdir -p ci-output

          cat > ci-output/image-metadata.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "image_tag": "${IMAGE_URI}",
            "image_digest": "${IMAGE_DIGEST}",
            "deployment_reference": "${FULL_IMAGE_REFERENCE}",
            "model_version": "${GITHUB_SHA}",
            "service_version": "ci-${GITHUB_RUN_NUMBER}"
          }
          EOF

          cat ci-output/image-metadata.json

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata-${{ github.sha }}
          path: production-mlops-lab/ci-output/image-metadata.json
          if-no-files-found: error
          retention-days: 30
      
  gcp-authentication-test:
    name: Test GitHub to GCP federation
    runs-on: ubuntu-latest
    needs: image-publishing
    
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: mlops-ci-publisher@production-mlops-06102026.iam.gserviceaccount.com
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Verify Artifact Registry access
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          gcloud artifacts repositories describe \
            heart-disease-images \
            --location=us-central1

      # Add Artifact Registry login and docker push steps below     