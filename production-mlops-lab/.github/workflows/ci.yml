name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python files
        run: |
          python -m compileall src scripts tests

      - name: Run unit tests
        run: |
          pytest -q

  model-validation:
    name: Train and validate model
    runs-on: ubuntu-latest
    needs:
      - validate

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download and verify dataset
        run: |
          ./scripts/fetch_dataset.sh

      - name: Run data preparation
        run: |
          python scripts/prepare_data.py

      - name: Train and evaluate model
        run: |
          python scripts/train.py

      - name: Export ONNX model
        run: |
          MODEL_URI="$(<artifacts/model-uri.txt)"
          python scripts/export_onnx.py --model-uri "${MODEL_URI}"

      - name: Validate ONNX Runtime parity
        run: |
          MODEL_URI="$(<artifacts/model-uri.txt)"
          python scripts/validate_onnx.py --model-uri "${MODEL_URI}"

      - name: Run model and ONNX tests
        run: |
          pytest -q

      - name: Upload generated model artefacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-model-artefacts-${{ github.sha }}
          path: |
            artifacts/evaluation.json
            artifacts/data-validation.json
            artifacts/heart_disease_model.onnx
          if-no-files-found: error
          retention-days: 7

  container-validation:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs:
      - model-validation

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download dataset
        run: |
          ./scripts/fetch_dataset.sh

      - name: Train model
        run: |
          python scripts/train.py

      - name: Export ONNX model
        run: |
          MODEL_URI="$(<artifacts/model-uri.txt)"
          python scripts/export_onnx.py --model-uri "${MODEL_URI}"

      - name: Validate ONNX model
        run: |
          MODEL_URI="$(<artifacts/model-uri.txt)"
          python scripts/validate_onnx.py --model-uri "${MODEL_URI}"

      - name: Build Docker image
        run: |
          docker build \
            --tag heart-disease-api:${{ github.sha }} \
            .

      - name: Start Docker container
        run: |
          docker run \
            --detach \
            --name heart-disease-api-ci \
            --publish 8000:8000 \
            --env MODEL_VERSION=${{ github.sha }} \
            --env SERVICE_VERSION=ci-${{ github.run_number }} \
            heart-disease-api:${{ github.sha }}

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then
              echo
              echo "Container is ready"
              exit 0
            fi

            echo "Waiting for container readiness: attempt ${attempt}"
            sleep 2
          done

          echo "Container did not become ready" >&2
          docker logs heart-disease-api-ci
          exit 1

      - name: Run container smoke test
        run: |
          ./scripts/container_smoke_test.sh

      - name: Inspect container user
        run: |
          docker exec heart-disease-api-ci id

      - name: Stop container
        if: always()
        run: |
          docker stop heart-disease-api-ci || true