[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-mlops"
version = "0.1.0"
description = "Production-style MLOps project for heart disease risk classification"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "mlflow>=2.12,<3",
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "onnx>=1.16,<2",
    "onnxruntime>=1.18,<2",
    "skl2onnx>=1.17,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx2>=2.16,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]